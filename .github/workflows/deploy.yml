name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
    paths:
      - 'front/**'
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the data branch
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: 'front/yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
          cp data-store/dashboard.json front/public/data/dashboard.json

      - name: Lint
        run: yarn lint

      - name: Build project
        run: yarn build
        env:
          VITE_IMPOSTOMETRO_PROXY_URL: ${{ vars.VITE_IMPOSTOMETRO_PROXY_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'front/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
